<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treejs</title>
  <script type="module" src="./script.js"></script>
</head>
<body>
  <h1>Color</h1>
  <div style="display: flex;">
    <div id="color" style="height: 100px; width:100px"></div>
    
    <div style="display: grid">
      <label>
        Red
        <input type="number" name="red" id="red" >
      </label>
      <label>
        Green
        <input type="number" name="green" id="green" >
      </label>
      <label>
        Blue
        <input type="number" name="blue" id="blue" >
      </label>
    </div>
  </div>
  <div id="threejs"></div>
  <pre>
r + ↑ : diminution quantité de rouge
r + ↓ : augmentation quantitée rouge
g + ↑ : diminution quantité de vert
g + ↓ : augmentation quantitée vert
b + ↑ : diminution quantité de bleu
b + ↓ : augmentation quantitée bleu
  </pre>
</body>
</html>
