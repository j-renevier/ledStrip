name: Deploy on GitHub Pages
on:
  push:
    branches: [ "feature/basics_api" ]
  pull_request:
    branches: [ "feature/basics_api" ]
    
permissions:
  contents: write
  id-token: write
  deployments: write
  pages: write 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '21'

    - name: Install dependencies
      run: npm ci
      working-directory: V2/interface

    - name: Build project for GitHub Pages
      run: npm run build:githubpage
      working-directory: V2/interface
    
    - name: Upload artifact for deployment
      uses: actions/upload-pages-artifact@v3
      with:
        path: V2/interface/dist
        name: github-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4